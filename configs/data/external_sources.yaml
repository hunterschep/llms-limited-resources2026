  - Enabled executable seed sources live in external_sources_uk.yaml and external_sources_sorbian.yaml.
  - Large corpora are scripted for Andromeda-scale acquisition, not downloaded by local smoke tests.
source_groups:
  ukrainian: configs/data/external_sources_uk.yaml
  sorbian: configs/data/external_sources_sorbian.yaml
