  - {lang: 0.75, mt: 0.75, edit: 0.5, qa: 0.5, mr: 0.25, format: 0.25}
  - {lang: 0.75, mt: 1.0, edit: 0.75, qa: 0.25, mr: 0.5, format: 0.25}
  - {lang: 0.75, mt: 1.0, edit: 0.75, qa: 0.25, mr: 0.25, format: 0.1}
search_grid:
