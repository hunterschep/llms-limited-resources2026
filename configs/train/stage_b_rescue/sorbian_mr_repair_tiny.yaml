max_examples_per_task: 500
method: lora_sft
adapter: lora
lora_r: 8
lora_alpha: 16
lora_dropout: 0.03
target_modules: [q_proj, v_proj, o_proj]
max_steps: 450
learning_rate: 0.000008
batch_size: 1
gradient_accumulation_steps: 16
max_length: 1536
seed: 2611
dry_run: false
stage_b_rescue_policy:
  forbid_stage_c_base: true
  preserve_mt_anchor: true
  target: recover MR without dropping MT below 41.0
