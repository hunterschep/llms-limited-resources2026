method: lora_sft
adapter: lora
lora_r: 8
lora_alpha: 16
lora_dropout: 0.03
target_modules: [q_proj, v_proj, o_proj]
max_steps: 700
learning_rate: 0.000006
batch_size: 1
gradient_accumulation_steps: 16
max_length: 1536
seed: 2613
dry_run: false
stage_b_rescue_policy:
  forbid_stage_c_base: true
  run_only_after_individual_repairs_pass_probe: true
  preserve_mt_anchor: true
